<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>For Each Plus Tests</title>
    <link rel="stylesheet" href="node_modules/mocha/mocha.css">
</head>
<body>
    <div id="mocha"></div>

    <script src="node_modules/mocha/mocha.js"></script>
    <script src="umd/index.js"></script>
    <script type="module">
        import * as chai from './node_modules/chai/chai.js';

        window.chai = chai;
        mocha.setup({ ui: 'bdd', reporter: 'spec' });
        await import('./test.js');

        // Custom reporter to show test progress
        function log(type, msg) {
            console.log(JSON.stringify({ type, msg }));
        }

        mocha.globals(['testResults']);
        window.testResults = new Promise(resolve => {
            mocha.run(resolve)
                .on('test', function(test) {
                    log('test', `Running: ${test.title}`);
                })
                .on('pass', function(test) {
                    log('pass', `✓ ${test.title}`);
                })
                .on('fail', function(test, err) {
                    log('fail', `✗ ${test.title}\n   ${err.message}`);
                })
                .on('end', function() {
                    log('end', JSON.stringify(this.stats));
                });
        });
    </script>
</body>
</html>
